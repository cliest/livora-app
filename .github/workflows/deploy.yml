name: Deploy to VPS

# Manual-only for now: tried auto-deploy-on-push, but runs got stuck
# indefinitely "Queued" on GitHub-hosted runners for this repo (billing and
# Actions-permissions both checked out fine, cause not identified) — not
# worth more time chasing since deploy/redeploy.sh run by hand over SSH does
# the same thing. Kept here, manual-trigger-only, in case it's worth
# revisiting later.
#
# One-time setup this needs (see deploy/SETUP.md step 12):
#   - A deploy keypair generated on the VPS, public half in the `livora`
#     user's ~/.ssh/authorized_keys.
#   - Repo secrets VPS_HOST and VPS_SSH_KEY (the private half of that key).
#   - deploy/livora-sudoers installed on the VPS, so redeploy.sh's
#     `sudo systemctl restart/reload` can run non-interactively.
on:
  workflow_dispatch: {} # manual "Run workflow" trigger only — no push trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: livora
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/livora-app
            ./deploy/redeploy.sh
