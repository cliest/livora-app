<!doctype html>
<html lang="en-ZM">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo/livora-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A2A33" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- No static <title>/<meta description> here on purpose: every route
         renders its own via <Seo> (components/Seo.jsx), which uses React
         19's native head-tag hoisting. A static fallback here wouldn't be
         replaced by that — React only manages tags it renders — so it would
         sit alongside the real one as a stale duplicate, which is exactly
         what non-JS crawlers (the ones scripts/prerender.mjs exists for)
         would see first. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
