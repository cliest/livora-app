# Nginx site config for livoradentalclinic.com — single-origin architecture:
# this one server serves the built client as static files AND reverse-proxies
# the API on the same domain, so the browser never makes a cross-origin
# request. That means no CORS complexity and the admin session cookie just
# works, with no SameSite/cross-site cookie edge cases to worry about.
#
# Install: copy to /etc/nginx/sites-available/livoradentalclinic.com,
# symlink into sites-enabled, `nginx -t`, then `systemctl reload nginx`.
# Then run `certbot --nginx -d livoradentalclinic.com -d www.livoradentalclinic.com`
# — certbot rewrites this file to add the HTTPS server block and the
# HTTP -> HTTPS redirect automatically; you shouldn't need to hand-edit that.
#
# Adjust CLIENT_ROOT if the repo lives somewhere other than /var/www/livora-app.

server {
    listen 80;
    listen [::]:80;
    server_name livoradentalclinic.com www.livoradentalclinic.com;

    root /var/www/livora-app/client/dist;
    index index.html;

    # Hashed, content-addressed build assets — safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Admin-uploaded team/testimonial/accreditation photos, served by the API.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All API traffic to the Express process (see deploy/livora-api.service).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: serve the matching prerendered <route>/index.html when
    # it exists (see client/scripts/prerender.mjs), otherwise fall back to
    # the SPA shell so React Router can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't let the build's own index.html be cached — it changes on every
    # deploy and browsers/CDNs must always fetch the latest one.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
