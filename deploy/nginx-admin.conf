# Staff dashboard: private address + Nginx password gate.
#
# This is a TEMPLATE. /ADMIN_PATH below is a placeholder: the real address is
# chosen on the VPS and lives only in /etc/nginx/snippets/livora-admin.conf.
# Never commit the real one — this repository is public. The dashboard's code
# never contains its own address either (src/admin/main.jsx reads it from the
# URL), so nothing in the site's JavaScript gives it away.
#
# Three layers, checked in order:
#   1. The address itself — /admin no longer exists; only /ADMIN_PATH works.
#   2. An Nginx username + password (auth_basic) on the dashboard page and
#      on every /api/admin/ request, checked before Node is ever reached.
#   3. The app's own sign-in: password + authenticator code, with lockout.
#
# Install steps: deploy/SETUP.md, "Staff dashboard: private address and
# password gate".

location ^~ /ADMIN_PATH {
    auth_basic "Livora staff";
    auth_basic_user_file /etc/nginx/livora-admin.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    try_files /admin.html =404;
}

# The dashboard's HTML is only reachable through the address above;
# requesting /admin.html directly gets a 404.
location = /admin.html {
    internal;
}

location ^~ /api/admin/ {
    auth_basic "Livora staff";
    auth_basic_user_file /etc/nginx/livora-admin.htpasswd;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
